site_name: PaneliumFX
site_description: A JavaFX UI library with a custom window frame (Panelium Chrome) and a MenuPane control
# Must NOT include a mike version segment: mike deploys every version under its own
# /panelium-fx/<version>/ path (the "latest" alias is a symlink to a single version), so a
# hardcoded segment here would double up in mkdocs-generated links (e.g. hreflang alternates).
site_url: https://kleinerhacker.github.io/panelium-fx/
repo_name: panelium-fx
repo_url: https://github.com/KleinerHacker/panelium-fx
edit_uri: edit/master/docs/docs/

docs_dir: docs
site_dir: ../build/docs

theme:
  name: material
  logo: assets/images/icon.png
  favicon: assets/images/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true

nav:
  - Home: index.md
  - Panelium Chrome:
      - Implementation: panelium-chrome/implementation.md
      - Customize Styles: panelium-chrome/customize-styles.md
  - MenuPane:
      - Implementation: menu-pane/implementation.md
      - Customize Styles: menu-pane/customize-styles.md
  - API Docs: dokka/html/index.html
  - Licences: licences/index.html
